<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Error</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f3f4f6;
            font-family: Arial, Helvetica, sans-serif;
        }

        .box {
            width: 500px;
            max-width: 90%;
            background: white;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,.08);
        }

        h1 {
            color: #dc2626;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #111827;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

    </style>

</head>


<body>

<div class="box">

    <h1>
        ⚠️ Error
    </h1>

    <p>
        {{ message }}
    </p>

    <a href="{{ url_for('home') }}">
        Return Home
    </a>

</div>

</body>

</html>
